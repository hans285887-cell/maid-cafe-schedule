<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天使ハート 女僕咖啡廳 - 內部管理系統 V10</title>
    <style>
        :root {
            --primary-color: #f36896; 
            --primary-dark: #d84373;
            --text-color: #2d3436;
            --bg-color: #fff0f3; 
            --border-color: #f8a5c2;
        }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); padding: 0; color: var(--text-color); margin: 0; -webkit-tap-highlight-color: transparent; }
        
        /* 頂部區域與登入按鈕 */
        .header { background-color: #2d3436; color: white; padding: 20px 10px 0 10px; text-align: center; position: relative; }
        .header h1 { margin: 0 0 10px 0; font-size: 20px; color: var(--primary-color); }
        .header p { margin: 0 0 15px 0; font-size: 12px; color: #ccc; }
        
        .admin-login-btn { position: absolute; top: 10px; right: 10px; background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .admin-login-btn.logged-in { background: #00b894; border-color: #00b894; color: white; }

        /* 導覽列優化 */
        .nav-tabs { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
        .tab-btn { background-color: #b2bec3; color: #2d3436; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px 8px 0 0; transition: 0.3s; flex-grow: 1; max-width: 150px; }
        .tab-btn.active { background-color: var(--primary-color); color: white; }

        .container { max-width: 1200px; margin: 10px auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--primary-color); border-bottom: 2px solid #ffeeef; padding-bottom: 8px; margin-top: 0; font-size: 18px; }

        /* --- 咖啡廳資訊 響應式佈局 --- */
        .info-grid { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 768px) { .info-grid { flex-direction: row; } .info-card { flex: 1; } }
        .info-card { background: #fffafb; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; }
        .info-list { list-style: none; padding: 0; line-height: 1.6; font-size: 14px; }
        .info-list li { margin-bottom: 8px; border-bottom: 1px solid #fff0f3; padding-bottom: 4px; }
        .info-list span { font-weight: bold; color: #555; width: 70px; display: inline-block; }
        .link-btn { display: block; text-align: center; background: var(--primary-color); color: white; text-decoration: none; padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        
        .map-container { margin-top: 10px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); height: 250px; }

        /* --- 女僕圖鑑 --- */
        .maid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        @media (min-width: 768px) { .maid-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; } }
        .maid-card { background: white; border: 1px solid #eee; border-radius: 10px; overflow: hidden; text-align: center; }
        .maid-img { width: 100%; height: 160px; object-fit: cover; }
        @media (min-width: 768px) { .maid-img { height: 220px; } }
        .maid-info { padding: 10px; }
        .maid-name { font-size: 15px; font-weight: bold; margin: 0; }
        .maid-ig { color: #636e72; font-size: 12px; text-decoration: none; margin-bottom: 10px; display: block; }
        .btn-schedule-link { background: #fff0f3; color: var(--primary-dark); border: 1px solid var(--border-color); padding: 6px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* --- 排班系統控制列 --- */
        .calendar-nav { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; background: #fffafb; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .calendar-nav select { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; font-size: 14px; }

        .admin-tools { display: none; flex-direction: column; gap: 10px; margin-bottom: 20px; background: #fffafb; padding: 15px; border-radius: 10px; border: 2px dashed #f8a5c2; }
        @media (min-width: 992px) { .admin-tools { flex-direction: row; } .card { flex: 1; } }
        .card { background: #fff; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; }
        .card h3 { margin-top: 0; font-size: 14px; color: #636e72; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; }
        .form-group { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
        .form-group label { width: 60px; text-align: right; flex-shrink: 0; font-weight: bold; color: #555; }
        .form-group input, .form-group select { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* --- 恢復 V8 的精美篩選列設計 --- */
        .filter-section { border: 1px solid #ffeaa7; background: #fff9db; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .member-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 5px; }
        .member-item { font-size: 14px; display: flex; align-items: center; gap: 6px; background: white; padding: 4px 10px; border-radius: 20px; border: 1px solid #ddd; }
        .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
        .btn-show-all { background: #2d3436; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; }

        /* --- 日曆優化 --- */
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); background: #2d3436; color: white; text-align: center; font-weight: bold; font-size: 12px; border-radius: 6px 6px 0 0; }
        .calendar-header div { padding: 8px 0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(80px, auto); border-left: 1px solid #eee; }
        @media (min-width: 768px) { .calendar-grid { grid-auto-rows: minmax(130px, auto); } }
        .day-cell { border-right: 1px solid #eee; border-bottom: 1px solid #eee; padding: 4px; position: relative; background: #fff; font-size: 11px; }
        .date-num { font-weight: bold; margin-bottom: 4px; color: #636e72; font-size: 12px; }
        .event-label { color: white; font-size: 10px; padding: 3px; border-radius: 3px; text-align: center; font-weight: bold; margin-bottom: 4px; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .shift-tag { font-size: 10px; padding: 2px 4px; border-radius: 3px; margin-bottom: 3px; border-left: 4px solid; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: block; font-weight: bold; }
        @media (min-width: 768px) { .event-label { font-size: 12px; padding: 4px; } .shift-tag { font-size: 12px; border-left-width: 5px; padding: 4px; } }
    </style>
</head>
<body>

<div class="header">
    <button class="admin-login-btn" id="login-btn" onclick="toggleAdmin()">🔒 店長登入</button>
    <h1>天使ハート 女僕咖啡廳</h1>
    <p>Angel Heart Maid Cafe - 內部入口網</p>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('tab-info', this)">🎀 店鋪資訊</button>
        <button class="tab-btn" onclick="switchTab('tab-members', this)">💖 成員圖鑑</button>
        <button class="tab-btn" onclick="switchTab('tab-schedule', this)">📅 排班系統</button>
    </div>
</div>

<div class="container">
    
    <div id="tab-info" class="tab-content active">
        <h2>🎀 聯絡與營業資訊</h2>
        <div class="info-grid">
            <div class="info-card">
                <ul class="info-list">
                    <li><span>早班時段</span> 13:00 - 17:30</li>
                    <li><span>晚班時段</span> 17:30 - 22:00</li>
                    <li><span>店家地址</span> 106 台北市大安區新生南路三段96-5號2樓</li>
                    <li><span>官方 IG</span> <a href="https://instagram.com/angelheartmaid_official" target="_blank" style="color:var(--primary-color);">@angelheartmaid_official</a></li>
                    <li><span>付款方式</span> 現金、LINE Pay</li>
                </ul>
                <div class="map-container">
                    <iframe 
                        width="100%" 
                        height="100%" 
                        frameborder="0" 
                        style="border:0" 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3615.111956555543!2d121.531238615006!3d25.01809058397985!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a98b0f209703%3A0xc3b8fb328ab837f!2zMTA25Y-w5YyX5biC5aSn5a6J5Y2A5paw55Sf5Y2X6Lev5LiJ5q61OTYtNeiZnw!5e0!3m2!1szh-TW!2stw!4v1715000000000!5m2!1szh-TW!2stw" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
            <div class="info-card">
                <h3>🔗 快速連結</h3>
                <a href="https://shop.ichefpos.com/store/Hkll__kj/ordering" target="_blank" class="link-btn">✨ 天使線上拍 (iCHEF)</a>
                <a href="https://reserve.oddle.me/zh_TW/angelheart/ticket/5572" target="_blank" class="link-btn" style="background:#2d3436;">📖 天界預約系統 (Oddle)</a>
            </div>
        </div>
    </div>

    <div id="tab-members" class="tab-content">
        <h2>💖 天使成員圖鑑</h2>
        <div class="maid-grid" id="maid-gallery"></div>
    </div>

    <div id="tab-schedule" class="tab-content">
        <div class="calendar-nav">
            <label style="font-weight: bold; color: #d84373;">📅 選擇月份：</label>
            <select id="view-year" onchange="renderCalendar()"></select>
            <select id="view-month" onchange="renderCalendar()"></select>
        </div>
        
        <div class="admin-tools" id="admin-panel">
            <div class="card">
                <h3>👥 1. 建立女僕</h3>
                <div class="form-group"><label>名稱</label><input type="text" id="new-name" placeholder="安晨"></div>
                <div class="form-group"><label>IG</label><input type="text" id="new-ig" placeholder="@ig"></div>
                <div class="form-group"><label>照片</label><input type="text" id="new-photo" placeholder="網址 (可留空)"></div>
                <div class="form-group"><label>色</label><input type="color" id="new-color" value="#f36896"></div>
                <button class="btn" style="background: #2d3436;" onclick="addOrUpdateMember()">儲存成員</button>
            </div>
            <div class="card">
                <h3>📅 2. 新增排班</h3>
                <div class="form-group"><label>日期</label><input type="number" id="shift-day" min="1" max="31" value="1"></div>
                <div class="form-group"><label>女僕</label><select id="shift-member"></select></div>
                <div class="form-group"><label>班別</label><select id="shift-type"><option value="morning">早班</option><option value="night">晚班</option><option value="full">一日</option></select></div>
                <button class="btn" onclick="addShift()">新增排班</button>
            </div>
            <div class="card">
                <h3>🎉 3. 主題活動</h3>
                <div class="form-group"><label>日期</label><input type="number" id="event-day" min="1" max="31" value="1"></div>
                <div class="form-group"><label>名稱</label><input type="text" id="event-name" placeholder="制服日"></div>
                <div class="form-group"><label>色</label><input type="color" id="event-color" value="#e84393"></div>
                <button class="btn" style="background: #e17055;" onclick="addEvent()">設定活動</button>
            </div>
        </div>

        <div class="filter-section">
            <div>
                <strong>🔍 篩選成員班表：</strong>
                <div class="member-list" id="filter-members"></div>
            </div>
            <button class="btn-show-all" onclick="showAllMembers()">顯示所有人</button>
        </div>

        <div class="calendar-header"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
        <div class="calendar-grid" id="calendar"></div>
    </div>
</div>

<script>
    let isAdmin = false;
    let maidData = {
        "安晨": { color: "#ff7675", ig: "@anchen_ig", photo: "" },
        "闇咪": { color: "#fdcb6e", ig: "@yami_cute", photo: "" }
    };
    
    // scheduleData 結構 { "2026-4": { "12": { event, shifts } } }
    let scheduleData = {
        "2026-4": {
            "12": { event: { name: "💖 雙馬尾日", color: "#e84393" }, shifts: [{ name: "安晨", time: "一日" }] }
        }
    };

    let activeFilters = new Set(Object.keys(maidData));

    function toggleAdmin() {
        const btn = document.getElementById('login-btn');
        const panel = document.getElementById('admin-panel');
        if (isAdmin) {
            isAdmin = false; btn.innerHTML = '🔒 店長登入'; btn.classList.remove('logged-in'); panel.style.display = 'none';
        } else {
            const pwd = prompt('請輸入店長密碼 (angel)：');
            if (pwd === 'angel') {
                isAdmin = true; btn.innerHTML = '🔓 登出'; btn.classList.add('logged-in'); panel.style.display = 'flex';
                switchTab('tab-schedule', document.querySelectorAll('.tab-btn')[2]);
            }
        }
    }

    function switchTab(tabId, btnElement) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btnElement.classList.add('active');
    }

    function init() {
        const yearSelect = document.getElementById("view-year");
        const monthSelect = document.getElementById("view-month");
        const now = new Date();
        for(let y=2025; y<=2027; y++){
            const opt = document.createElement("option"); opt.value = y; opt.textContent = y + "年";
            if(y === now.getFullYear()) opt.selected = true; yearSelect.appendChild(opt);
        }
        for(let m=1; m<=12; m++){
            const opt = document.createElement("option"); opt.value = m; opt.textContent = m + "月";
            if(m === (now.getMonth()+1)) opt.selected = true; monthSelect.appendChild(opt);
        }
        updateMemberDropdown(); renderMaidGallery(); renderFilters(); renderCalendar();
    }

    function renderCalendar() {
        const year = parseInt(document.getElementById("view-year").value);
        const month = parseInt(document.getElementById("view-month").value);
        const calendarEl = document.getElementById("calendar");
        calendarEl.innerHTML = "";

        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const monthKey = `${year}-${month}`;

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement("div"); empty.className = "day-cell";
            empty.style.background = "#fafafa"; calendarEl.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement("div"); cell.className = "day-cell";
            let html = `<div class="date-num">${day}</div>`;
            
            if (scheduleData[monthKey] && scheduleData[monthKey][day]) {
                const dayData = scheduleData[monthKey][day];
                if (dayData.event) {
                    const ec = dayData.event.color;
                    cell.style.border = `1.5px solid ${ec}`; cell.style.backgroundColor = `${ec}1A`;
                    html += `<div class="event-label" style="background-color: ${ec};">${dayData.event.name}</div>`;
                }
                dayData.shifts.forEach(s => {
                    if (activeFilters.has(s.name)) {
                        const mc = maidData[s.name] ? maidData[s.name].color : "#ccc";
                        html += `<div class="shift-tag" style="border-left-color: ${mc}; background-color: ${mc}1A; color: #333;">${s.name}(${s.time})</div>`;
                    }
                });
            }
            cell.innerHTML = html; calendarEl.appendChild(cell);
        }
    }

    function addShift() {
        const year = document.getElementById("view-year").value;
        const month = document.getElementById("view-month").value;
        const day = document.getElementById("shift-day").value;
        const name = document.getElementById("shift-member").value;
        const type = document.getElementById("shift-type").value;
        const monthKey = `${year}-${month}`;
        const timeText = type === "full" ? "一日" : (type === "morning" ? "早班" : "晚班");

        if (!scheduleData[monthKey]) scheduleData[monthKey] = {};
        if (!scheduleData[monthKey][day]) scheduleData[monthKey][day] = { event: null, shifts: [] };
        scheduleData[monthKey][day].shifts.push({ name: name, time: timeText });
        renderCalendar();
    }

    function addEvent() {
        const year = document.getElementById("view-year").value;
        const month = document.getElementById("view-month").value;
        const day = document.getElementById("event-day").value;
        const name = document.getElementById("event-name").value;
        const color = document.getElementById("event-color").value;
        const monthKey = `${year}-${month}`;
        if (!scheduleData[monthKey]) scheduleData[monthKey] = {};
        if (!scheduleData[monthKey][day]) scheduleData[monthKey][day] = { event: null, shifts: [] };
        scheduleData[monthKey][day].event = { name: name, color: color };
        renderCalendar();
    }

    function updateMemberDropdown() {
        const select = document.getElementById("shift-member"); select.innerHTML = "";
        Object.keys(maidData).forEach(m => {
            const opt = document.createElement("option"); opt.value = m; opt.textContent = m; select.appendChild(opt);
        });
    }

    /* 恢復 V8 美觀的篩選按鈕渲染方式 */
    function renderFilters() {
        const filterBox = document.getElementById("filter-members");
        filterBox.innerHTML = "";
        Object.keys(maidData).forEach(member => {
            const div = document.createElement("div");
            div.className = "member-item";
            const checked = activeFilters.has(member) ? "checked" : "";
            const color = maidData[member].color;
            div.innerHTML = `
                <input type="checkbox" ${checked} onchange="toggleFilter('${member}')" id="chk-${member}">
                <span class="color-dot" style="background-color: ${color};"></span>
                <label for="chk-${member}" style="cursor: pointer; font-weight: bold; color: #555;">${member}</label>
            `;
            filterBox.appendChild(div);
        });
    }

    function toggleFilter(member) {
        if (activeFilters.has(member)) activeFilters.delete(member); 
        else activeFilters.add(member); 
        renderCalendar();
    }

    function showAllMembers() {
        activeFilters = new Set(Object.keys(maidData));
        renderFilters();
        renderCalendar();
    }

    function renderMaidGallery() {
        const gallery = document.getElementById("maid-gallery"); gallery.innerHTML = "";
        Object.keys(maidData).forEach(name => {
            const data = maidData[name];
            let imgUrl = data.photo;
            if (!imgUrl) {
                const encodedColor = data.color.replace('#', '%23');
                imgUrl = `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300'%3E%3Crect width='300' height='300' fill='${encodedColor}' opacity='0.2'/%3E%3Ctext x='50%25' y='50%25' fill='${encodedColor}' font-size='40' font-family='sans-serif' font-weight='bold' dominant-baseline='middle' text-anchor='middle'%3E${name}%3C/text%3E%3C/svg%3E`;
            }
            const div = document.createElement("div"); div.className = "maid-card";
            div.innerHTML = `
                <img src="${imgUrl}" alt="${name}" class="maid-img" style="border-bottom-color: ${data.color};">
                <div class="maid-info">
                    <h3 class="maid-name"><span class="color-dot" style="background-color: ${data.color}"></span> ${name}</h3>
                    <a href="https://instagram.com/${data.ig.replace('@','')}" target="_blank" class="maid-ig">${data.ig || "未提供 IG"}</a>
                    <button class="btn-schedule-link" style="color:${data.color}; border-color:${data.color};" onclick="viewMaidSchedule('${name}')">📅 查看 ${name} 班表</button>
                </div>
            `;
            gallery.appendChild(div);
        });
    }

    function viewMaidSchedule(n) { 
        switchTab('tab-schedule', document.querySelectorAll('.tab-btn')[2]); 
        activeFilters.clear(); 
        activeFilters.add(n); 
        renderFilters(); 
        renderCalendar(); 
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function addOrUpdateMember() {
        const n = document.getElementById("new-name").value; 
        const ig = document.getElementById("new-ig").value; 
        const photo = document.getElementById("new-photo").value;
        const c = document.getElementById("new-color").value;
        if(!n) return alert("請輸入女僕名稱！"); 
        
        maidData[n] = { color: c, ig: ig, photo: photo }; 
        activeFilters.add(n);
        
        updateMemberDropdown(); 
        renderMaidGallery(); 
        renderFilters(); 
        renderCalendar();
        
        document.getElementById("new-name").value = "";
        document.getElementById("new-ig").value = "";
        document.getElementById("new-photo").value = "";
        alert(`已成功將 ${n} 加入圖鑑與排班名單中！`);
    }

    init();
</script>
</body>
</html>
